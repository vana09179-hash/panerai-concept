<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="UI concept / design study. Not affiliated with Officine Panerai.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panerai — website concept (design study)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <!-- ============ HEADER ============ -->
  <header class="header">
    <a href="#" class="logo">PANERAI</a>
    <nav class="nav">
      <a href="#" class="is-active" data-cursor="pill">Collections</a>
      <a href="#" data-cursor="pill">Accessories</a>
      <a href="#" data-cursor="pill">Know How</a>
      <a href="#" data-cursor="pill">Services</a>
      <a href="#" data-cursor="pill">Boutiques</a>
      <a href="#" data-cursor="pill">About Panerai</a>
    </nav>
    <div class="header-icons">
      <button class="icon-btn bag" aria-label="Bag" data-cursor="dot">
        <svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="badge"></span><span class="bag-count">0</span>
      </button>
      <button class="icon-btn" aria-label="Wishlist" data-cursor="dot">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>
      </button>
      <button class="icon-btn" aria-label="Account" data-cursor="dot">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ STAGE ============ -->
  <main class="stage" id="stage">
    <div class="slides" id="slides"><!-- slides are rendered by script.js --></div>

    <button class="share-btn" aria-label="Share" data-cursor="dot">
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.3 10.8 7.4-4.4M8.3 13.2l7.4 4.4"/></svg>
    </button>

    <div class="dots" id="dots"></div>

    <!-- ============ DETAIL LAYER ============ -->
    <div class="detail" id="detail">
      <button class="d-back" id="backBtn" data-cursor="pill">
        <svg viewBox="0 0 30 12"><path d="M29 6H3M8 1 3 6l5 5"/></svg><span>Back</span>
      </button>

      <div class="d-tools">
        <button data-tool="full" aria-label="Fullscreen" data-cursor="dot"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5M4 4l6 6M20 4l-6 6M20 20l-6-6M4 20l6-6"/></svg></button>
        <button data-tool="zoom" aria-label="Zoom" data-cursor="dot"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M10.5 7.5v6M7.5 10.5h6"/></svg></button>
        <button data-tool="rotate" aria-label="Rotate" data-cursor="dot"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg></button>
      </div>

      <button class="d-play" data-play data-cursor="fill">
        <span class="ring"><svg viewBox="0 0 24 24"><path d="M9 7v10l8-5-8-5Z"/></svg></span>
        <span class="lbl">Watch video</span>
      </button>

      <div class="d-nav">
        <button class="arr prev" data-dir="-1" aria-label="Previous" data-cursor="dot"><svg viewBox="0 0 12 20"><path d="M10 2 2 10l8 8"/></svg></button>
        <span class="sep"></span>
        <button class="arr next" data-dir="1" aria-label="Next" data-cursor="dot"><svg viewBox="0 0 12 20"><path d="m2 2 8 8-8 8"/></svg></button>
      </div>

      <div class="d-theme">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <button class="switch" id="themeSwitch" aria-label="Toggle theme" data-cursor="dot"><span class="knob"></span></button>
        <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </div>

      <aside class="aside" id="aside">
        <div class="a-in">
          <h2 class="a-title" data-a></h2>
          <div class="a-size" data-a></div>
          <div class="a-ref" data-a></div>
          <div class="a-row" data-a>
            <button class="wish" id="wishBtn" data-cursor="pill"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg><span>Add to wishlist</span></button>
            <button class="shr" id="shareBtn" data-cursor="pill"><svg viewBox="0 0 24 24"><path d="M14 5l7 6-7 6v-3.5c-5 0-8 1.5-10 5 .5-5.5 3.5-10 10-11V5Z"/></svg><span>Share</span></button>
          </div>
          <div class="a-buy" data-a>
            <button class="add" id="addBtn" data-cursor="pill"><span>Add to bag</span></button>
            <div class="price"><b></b><small>Incl. sales tax</small></div>
          </div>
          <ul class="a-list">
            <li data-a><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><a href="#" data-cursor="pill">Technical details</a></li>
            <li data-a><svg viewBox="0 0 24 24" class="fill"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg><a href="#" data-cursor="pill">Find your nearest boutique</a></li>
            <li data-a><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="1"/><path d="M8 2v4M16 2v4M8 13l3 3 5-6"/></svg><a href="#" data-cursor="pill">Make an appointment</a></li>
            <li data-a><svg viewBox="0 0 24 24" class="fill"><path d="M12 1.5 14.6 4l3.5-.4.7 3.5 3.1 1.8-1.5 3.1 1.5 3.1-3.1 1.8-.7 3.5-3.5-.4L12 22.5 9.4 20l-3.5.4-.7-3.5-3.1-1.8 1.5-3.1-1.5-3.1 3.1-1.8.7-3.5 3.5.4L12 1.5Z"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="#fff" fill="none"/></svg><a href="#" data-cursor="pill">Sales info</a></li>
            <li data-a><svg viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6V2Z"/><path d="M14 2v4h4"/></svg><a href="#" data-cursor="pill">Product warranty</a></li>
            <li data-a><svg viewBox="0 0 24 24"><path d="M12 3v11M7 9l5 5 5-5M4 15v5h16v-5"/></svg><a href="#" data-cursor="pill">Download instruction</a></li>
          </ul>
        </div>
      </aside>
    </div>

    <button class="chat-btn" aria-label="Chat" data-cursor="dot">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Z"/><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
  </main>

  <!-- ============ VIDEO MODAL ============ -->
  <div class="vmodal" id="vmodal" aria-hidden="true">
    <div class="v-logo">PANERAI</div>
    <button class="v-close" id="vClose" aria-label="Close" data-cursor="fill"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
    <video id="video" playsinline preload="metadata"></video>
    <div class="v-spinner"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="20"/></svg></div>
    <div class="v-bar">
      <button class="v-pp" id="vPlay" aria-label="Play / Pause" data-cursor="dot">
        <svg class="prog" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20"/><circle class="p" cx="22" cy="22" r="20"/></svg>
        <svg class="i-play" viewBox="0 0 24 24"><path d="M9 7v10l8-5-8-5Z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 6h3v12H8zM13 6h3v12h-3z"/></svg>
      </button>
      <span class="v-time" id="vTime">00:00</span>
      <div class="v-track" id="vTrack"><div class="v-fill" id="vFill"></div></div>
      <button class="v-vol" id="vVol" aria-label="Mute" data-cursor="dot">
        <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4V9Z" class="fill"/><path class="w" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="m16 9 6 6M22 9l-6 6"/></svg>
      </button>
    </div>
  </div>

  <div class="concept-tag">Design concept · not affiliated with Officine Panerai</div>
  <div class="toast" id="toast"></div>
  <div class="cursor" id="cursor"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
